x-application-environment: &application-environment
  APP_ENV: local
  APP_DEBUG: "true"
  APP_KEY: "base64:SR41gvnE6fPMg0JT5VVhjq/4SjMDLYnL8vfmQAtj5gg="
  DB_CONNECTION: pgsql
  DB_HOST: database
  DB_PORT: 5432
  DB_DATABASE: bumpa
  DB_USERNAME: bumpa
  DB_PASSWORD: bumpa
  QUEUE_CONNECTION: database
  PAYMENT_DRIVER: log

services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: bumpa
      POSTGRES_USER: bumpa
      POSTGRES_PASSWORD: bumpa
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bumpa -d bumpa"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      database:
        condition: service_healthy
    environment:
      <<: *application-environment
      RUN_MIGRATIONS: "1"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8000/up"]
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    build: .
    command: ["php", "artisan", "queue:work", "--tries=5", "--timeout=60"]
    environment: *application-environment
    depends_on:
      web:
        condition: service_healthy

volumes:
  postgres-data:
